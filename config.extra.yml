    fields:
      title: h1, h2, h3, .titulo, .title
      summary: body
    detailFields:
      address: meta[name='description']::attr(content), meta[property='og:description']::attr(content), h1, body
      area: .caracteristicasDeFicha li:has(strong:contains('Superficie Cubierta')) span, .caracteristicasDeFicha li:has(strong:contains('Superficie Total')) span
      price: meta[name='description']::attr(content), meta[property='og:description']::attr(content), body
      propertyType: .caracteristicasDeFicha li:has(strong:contains('Tipo:')) span, h1
      title: meta[property='og:title']::attr(content), h1, title
      summary: meta[name='description']::attr(content), meta[property='og:description']::attr(content), body
      city: meta[property='og:title']::attr(content)
    preferConfiguredFields: true
    website: https://duquewilliams.com
    enabled: true
    notes: Catalogo identificado como Mardelplata; URLs descubiertas en el sitio publico, ventas y alquileres donde estan disponibles. Campos por verificar en la proxima extraccion.
    detailUrls: []
  - name: Kisic Propiedades
    website: https://kisicpropiedades.com/
    enabled: true
    startUrls:
      - https://kisicpropiedades.com/listing?purpose=rent
      - https://kisicpropiedades.com/listing?purpose=sale
      - https://kisicpropiedades.com/listing?purpose=temporary_rental
    pagination:
      maxPages: 4
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    detailFields:
      title: .detail__title
      address: .detail__address
      city: .detail__address
      price: .detail__price
      operation: .detail__badges .tag--op
      propertyType: .detail__badges .tag--type
      rooms: .detail__main .feats li:contains('Ambientes') strong
      parking: .detail__main .feats li:contains('Cochera') strong
      area: .detail__main .kv:contains('cubierta')
      summary: .detail__text
    publicationUrlRegex: /ad/[^/?]+
    preferConfiguredFields: true
    notes: 'Catálogo Pixel Inmobiliario verificado: ventas, alquileres y temporarios; extracción de ambientes y cochera desde la ficha principal.'
  - name: Del Prete Propiedades
    website: https://www.delpretepropiedades.com/
    enabled: true
    startUrls:
      - https://www.delpretepropiedades.com/listing?user_id=1029&purpose=rent
      - https://www.delpretepropiedades.com/listing?user_id=1029&purpose=sale
    pagination:
      maxPages: 10
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    publicationUrlRegex: /ad/[^/?]+
    preferConfiguredFields: true
    detailFields:
      title: .icon_default h5
      address: .icon_default p
      city: .icon_default p
      operation: .sale:has(> div)
      price: .sale:not(:has(> div))
      propertyType: .amount
      rooms: .btn-group.w-100:contains(Ambientes) .number
      area: .btn-group.w-100:contains(Cubiertos)
      parking: .btn-group.w-100:contains(Cochera) .number
      summary: .property_details
    notes: Listados de venta y alquiler verificados. Ficha Pixel con ambientes y superficie en bloques de atributos.
  - name: Muiño Propiedades
    startUrls:
      - https://www.xn--muiopropiedades-0qb.com.ar/Alquiler
      - https://www.xn--muiopropiedades-0qb.com.ar/Venta
      - https://www.xn--muiopropiedades-0qb.com.ar/Alquiler-temporario
    pagination:
      maxPages: 5
      pageParam: p
      firstPage: 2
      params:
        o: 2,2
    listingSelector: a[href^="/p/"]
    publicationUrlRegex: /p/
    fields:
      address: .prop-desc-dir
      city: .prop-desc-tipo-ub, .single_property_title p
      propertyType: .prop-desc-tipo-ub
      rooms: .prop-data2:has(img[src*="/ambientes."]) > div
    detailFields:
      address: .title-address
      price: .operations-box .operation-val
      area: '#lista_superficies li:contains("Cubierta:")'
      propertyType: .ficha_detalle_item:has(b:contains("Tipo de Propiedad"))
      rooms: .ficha_detalle_item:has(b:contains("Ambientes"))
      summary: '#descripcion, .property-description, .description'
    website: https://www.xn--muiopropiedades-0qb.com.ar/
    enabled: true
    notes: Sitio Tokko verificado. Publica en San Bernardo del Tuyú; se conserva el filtro global de ciudad Mar del Plata.
  - name: Alem Propiedades
    website: https://alempropiedades.com/
    enabled: true
    startUrls:
      - https://alempropiedades.com/search?business_type%5B0%5D=for_rent&order_by=created_at&order=desc&page=1&for_sale=0&for_rent=1&for_temporary_rent=0&for_transfer=0&lax_business_type=1
      - https://alempropiedades.com/search?business_type%5B0%5D=for_sale&order_by=created_at&order=desc&page=1&for_sale=1&for_rent=0&for_temporary_rent=0&for_transfer=0&lax_business_type=1
    pagination:
      maxPages: 3
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    publicationUrlRegex: /(?:casa|chalet|departamento|lote-terreno|terreno|ph|local|oficina|galpon-industrial)-(?:venta|alquiler)[^?]*/\d+(?:$|[?#])
    skipJsonLdRooms: true
    detailFields:
      title: h1.title
      city: .list-info-2 li:contains(Ciudad)
      neighborhood: .list-info-2 li:contains(Zona)
      propertyType: .list-info-2 li:contains(Tipo de inmueble)
      operation: .list-info-2 li:contains(Tipo de negocio)
      price: .blq_precio
      rooms: .list-info-2 li:contains(Ambientes), h1.title
      area: .list-info-2 li:contains(Área Construida)
      parking: .list-info-2 li:contains(Cochera), .list-info-2 li:contains(Garaje)
      summary: '.areaDetalle article, #Description article, .description'
    notes: Sitio Alem / Pernice Edgardo solicitado expresamente. Extracción Wasi verificada; no se usan dormitorios de JSON-LD como ambientes.
  - name: Saforcada Propiedades
    website: https://www.saforcada.com/
    enabled: true
    startUrls:
      - https://www.saforcada.com/
    format: adincoCatalog
    realEstateId: 16830
    propertySlug: saforcada
    pagination:
      maxPages: 10
    notes: Catálogo público Adinco y datos SSR verificados. Ciudad, ambientes y cochera provienen de cada ficha; el primer ingreso se valida con una muestra parcial.
  - name: Eduardo Villarreal Propiedades
    website: https://eduardovillarreal.com.ar/
    enabled: true
    pagination:
      maxPages: 3
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    preferConfiguredFields: true
    startUrls:
      - https://eduardovillarreal.com.ar/search?business_type%5B0%5D=for_sale&order_by=max_price&order=desc&page=1&for_sale=1&for_rent=0&for_temporary_rent=0&for_transfer=0&lax_business_type=1
    skipJsonLdRooms: true
    publicationUrlRegex: /(?:casa|chalet|departamento|lote-terreno|terreno|ph|local|oficina|galpon-industrial)-(?:venta|alquiler)[^?]*/\d+(?:$|[?#])
    detailFields:
      title: h1.title
      address: .title-address
      city: .list-info-1a li:contains(Ciudad), .list-info-2 li:contains(Ciudad)
      neighborhood: .list-info-1a li:contains(Zona), .list-info-2 li:contains(Zona)
      propertyType: .list-info-1a li:contains(Tipo de inmueble), .list-info-2 li:contains(Tipo de inmueble)
      operation: .list-info-1a li:contains(Tipo de negocio), .list-info-2 li:contains(Tipo de negocio)
      price: .precio .pr, .blq_precio, .list-info-1a li:contains(Valor)
      area: .list-info-1a li:contains(Área Construida), .list-info-2 li:contains(Área Construida)
      rooms: .list-info-1a li:contains(Ambientes), .list-info-2 li:contains(Ambientes), h1.title
      parking: .list-info-1a li:contains(Garaje), .list-info-2 li:contains(Cochera)
      summary: '.areaDetalle article, #Description article'
    notes: Sitio Wasi verificado; catálogo de venta. Se preserva la cantidad de ambientes indicada por la ficha o el título.
  - name: Fulquet Propiedades
    website: https://www.fulquetpropiedades.com.ar/
    enabled: true
    pagination:
      maxPages: 1
    listingSelector: a[href]
    preferConfiguredFields: true
    startUrls:
      - https://www.fulquetpropiedades.com.ar/casa-chalet-en-venta.html
      - https://www.fulquetpropiedades.com.ar/departamento-en-venta.html
      - https://www.fulquetpropiedades.com.ar/terreno-en-venta.html
    publicationUrlRegex: (?:casa---chalet|chalet|casa|departamento|terreno|lote)-(?:venta|alquiler).*propiedad-inmobiliaria\.html
    detailFields:
      title: h1.tituloDeFicha
      address: .caracteristicasDeFicha li:contains(Dirección) span
      city: meta[property='og:title']::attr(content)
      neighborhood: .caracteristicasDeFicha li:contains('Zona:') span
      price: .caracteristicasDeFicha li:contains(Valor) span
      propertyType: .caracteristicasDeFicha li:has(strong:contains('Tipo:')) span, h1.tituloDeFicha
      area: .caracteristicasDeFicha li:contains(Superficie Cubierta), .caracteristicasDeFicha li:contains(Superficie Total)
      rooms: .caracteristicasDeFicha li:contains(Ambientes) span
      parking: .caracteristicasDeFicha li:contains(Cochera) span
      summary: .descripcionDeFicha
    notes: Catálogo Inmobiliática verificado; listados de venta de casas, departamentos y terrenos. Campos de la ficha principal.
    skipJsonLdRooms: true
  - name: Groppo Propiedades
