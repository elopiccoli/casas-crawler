  - name: Napolitano Inmobiliaria
    startUrls: []
    pagination:
      maxPages: 5
      pageParam: p
      firstPage: 2
      params:
        o: 2,2
    listingSelector: a[href^="/p/"]
    publicationUrlRegex: /p/
    fields:
      address: .prop-desc-dir
