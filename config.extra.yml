      - https://duquewilliams.com/departamento-en-venta.html
      - https://duquewilliams.com/terreno-en-venta.html
    pagination:
      maxPages: 1
    listingSelector: a[href]
    publicationUrlRegex: (?:casa---chalet|chalet|casa|departamento|terreno|lote)-(?:venta|alquiler).*propiedad-inmobiliaria\.html
    fields:
      title: h1, h2, h3, .titulo, .title
      summary: body
    detailFields:
      address: meta[name='description']::attr(content), meta[property='og:description']::attr(content), h1, body
      area: .caracteristicasDeFicha li:has(strong:contains('Superficie Cubierta')) span, .caracteristicasDeFicha li:has(strong:contains('Superficie Total')) span
      price: meta[name='description']::attr(content), meta[property='og:description']::attr(content), body
      propertyType: .caracteristicasDeFicha li:has(strong:contains('Tipo:')) span, h1
      title: meta[property='og:title']::attr(content), h1, title
      summary: meta[name='description']::attr(content), meta[property='og:description']::attr(content), body
      city: meta[property='og:title']::attr(content)
    preferConfiguredFields: true
    website: https://duquewilliams.com
    enabled: true
    notes: Catalogo identificado como Mardelplata; URLs descubiertas en el sitio publico, ventas y alquileres donde estan disponibles. Campos por verificar en la proxima extraccion.
    detailUrls: []
  - name: Kisic Propiedades
    website: https://kisicpropiedades.com/
    enabled: true
    startUrls:
      - https://kisicpropiedades.com/listing?purpose=rent
      - https://kisicpropiedades.com/listing?purpose=sale
      - https://kisicpropiedades.com/listing?purpose=temporary_rental
    pagination:
      maxPages: 4
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    detailFields:
      title: .detail__title
      address: .detail__address
      city: .detail__address
      price: .detail__price
      operation: .detail__badges .tag--op
      propertyType: .detail__badges .tag--type
      rooms: .detail__main .feats li:contains('Ambientes') strong
      parking: .detail__main .feats li:contains('Cochera') strong
      area: .detail__main .kv:contains('cubierta')
      summary: .detail__text
    publicationUrlRegex: /ad/[^/?]+
    preferConfiguredFields: true
    notes: 'Catálogo Pixel Inmobiliario verificado: ventas, alquileres y temporarios; extracción de ambientes y cochera desde la ficha principal.'
  - name: Del Prete Propiedades
    website: https://www.delpretepropiedades.com/
    enabled: true
    startUrls:
      - https://www.delpretepropiedades.com/listing?user_id=1029&purpose=rent
      - https://www.delpretepropiedades.com/listing?user_id=1029&purpose=sale
    pagination:
      maxPages: 10
      pageParam: page
      firstPage: 2
    listingSelector: a[href]
    publicationUrlRegex: /ad/[^/?]+
    preferConfiguredFields: true
    detailFields:
      title: .icon_default h5
      address: .icon_default p
      city: .icon_default p
      operation: .sale:has(> div)
      price: .sale:not(:has(> div))
      propertyType: .amount
      rooms: .btn-group.w-100:contains(Ambientes) .number
      area: .btn-group.w-100:contains(Cubiertos)
      parking: .btn-group.w-100:contains(Cochera) .number
      summary: .property_details
    notes: Listados de venta y alquiler verificados. Ficha Pixel con ambientes y superficie en bloques de atributos.
  - name: Muiño Propiedades
    startUrls:
      - https://www.xn--muiopropiedades-0qb.com.ar/Alquiler
      - https://www.xn--muiopropiedades-0qb.com.ar/Venta
      - https://www.xn--muiopropiedades-0qb.com.ar/Alquiler-temporario
    pagination:
      maxPages: 5
      pageParam: p
      firstPage: 2
      params:
        o: 2,2
    listingSelector: a[href^="/p/"]
    publicationUrlRegex: /p/
    fields:
      address: .prop-desc-dir
      city: .prop-desc-tipo-ub, .single_property_title p
      propertyType: .prop-desc-tipo-ub
      rooms: .prop-data2:has(img[src*="/ambientes."]) > div
    detailFields:
      address: .title-address
      price: .operations-box .operation-val
      area: '#lista_superficies li:contains("Cubierta:")'
      propertyType: .ficha_detalle_item:has(b:contains("Tipo de Propiedad"))
      rooms: .ficha_detalle_item:has(b:contains("Ambientes"))
      summary: '#descripcion, .property-description, .description'
    website: https://www.xn--muiopropiedades-0qb.com.ar/
    enabled: true
    notes: Sitio Tokko verificado. Publica en San Bernardo del Tuyú; se conserva el filtro global de ciudad Mar del Plata.
