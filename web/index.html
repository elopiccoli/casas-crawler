<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Casas Mar del Plata</title>
    <link rel="stylesheet" href="styles.css?v=20261018-filters">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Casas Mar del Plata</h1>
        <p id="status">Cargando publicaciones...</p>
      </div>
      <nav class="header-actions" aria-label="Acciones">
        <a
          class="refresh"
          href="https://github.com/elopiccoli/casas-crawler/actions/workflows/add-urls.yml"
          target="_blank"
          rel="noopener noreferrer"
          title="Agregar inmobiliarias o publicaciones sin recorrer las fuentes anteriores"
        >Agregar URLs</a>
        <a
          class="run-workflow"
          href="https://github.com/elopiccoli/casas-crawler/actions/workflows/deploy-firebase.yml"
          target="_blank"
          rel="noopener noreferrer"
          title="Abrir GitHub Actions para iniciar una actualización"
        >Actualizar</a>
        <a class="refresh" href="./publicaciones.json" target="_blank" rel="noopener noreferrer">JSON</a>
      </nav>
    </header>

    <main>
      <section class="filters" aria-label="Filtros">
        <label>
          Buscar
          <input id="search" type="search" placeholder="Barrio, calle o inmobiliaria">
        </label>
        <label>
          Precio máximo
          <input id="maxPrice" type="number" min="0" step="1000" placeholder="Moneda publicada">
        </label>
        <div class="rooms-filter">
          <span id="neighborhoodLabel" class="filter-label">Barrios</span>
          <details id="neighborhoodDropdown" class="rooms-dropdown">
            <summary aria-labelledby="neighborhoodLabel neighborhoodSummary"><span id="neighborhoodSummary" class="selection-summary">Todos</span></summary>
            <div class="rooms-menu">
              <button id="clearNeighborhoods" class="clear-selection" type="button">Mostrar todos</button>
              <div id="neighborhoodOptions" class="checkbox-options" role="group" aria-labelledby="neighborhoodLabel"></div>
            </div>
          </details>
        </div>
        <label>
          Operación
          <select id="operation">
            <option value="">Todas</option>
            <option value="Venta">Venta</option>
            <option value="Alquiler">Alquiler</option>
          </select>
        </label>
        <label>
          Tipo
          <select id="propertyType">
            <option value="">Todos</option>
            <option value="Casa">Casa</option>
            <option value="Departamento">Departamento</option>
            <option value="Terreno">Terreno</option>
            <option value="Lote">Lote</option>
          </select>
        </label>
        <label>
          Inmobiliaria
          <select id="agency">
            <option value="">Todas</option>
          </select>
        </label>
        <div class="rooms-filter">
          <span id="roomsLabel" class="filter-label">Ambientes</span>
          <details id="roomsDropdown" class="rooms-dropdown">
            <summary aria-labelledby="roomsLabel roomsSummary"><span id="roomsSummary" class="selection-summary">Todos</span></summary>
            <div class="rooms-menu">
              <button id="clearRooms" class="clear-selection" type="button">Mostrar todos</button>
              <div id="roomsOptions" class="checkbox-options" role="group" aria-labelledby="roomsLabel"></div>
            </div>
          </details>
        </div>
        <label>
          Cochera
          <select id="parking">
            <option value="">Todas</option>
            <option value="Sí">Con cochera</option>
            <option value="No">Sin cochera</option>
            <option value="Opcional">Cochera opcional</option>
            <option value="No informado">Sin dato</option>
          </select>
        </label>
      </section>

      <section class="summary" aria-live="polite">
        <strong id="resultCount">0</strong>
        <span>publicaciones</span>
      </section>

      <section id="results" class="results" aria-label="Publicaciones"></section>
      <p id="empty" class="empty" hidden>No hay publicaciones para esos filtros.</p>
    </main>

    <script type="module" src="app.js?v=20261018-filters"></script>
  </body>
</html>
