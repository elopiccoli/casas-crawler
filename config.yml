request:
  delayMs: 1200
  timeoutMs: 20000
  userAgent: Mozilla/5.0 (compatible; CasasCrawler/0.1; +https://example.local)
excel:
  sheetName: Publicaciones
filters:
  price:
    min: null
    max: null
    currency: null
  propertyTypes:
    - Casa
    - Chalet
    - Departamento
    - Terreno
    - Lote
  city: Mar del Plata
  neighborhoods: []
sources:
  - name: Russillo Asesores Inmobiliarios
    startUrls:
      - https://www.russilloinmobiliaria.com/Alquiler
      - https://www.russilloinmobiliaria.com/Venta
    pagination:
      maxPages: 5
      pageParam: p
      firstPage: 2
      params:
        o: 2,2
    listingSelector: a.item.card-prop-short-wide[href^='/p/']
    publicationUrlRegex: /p/
    fields:
      address: p:has(.flaticon-placeholder)
      area: .prop_details li
      price: .price-list-tag
      propertyType: .text-thm
      title: .prop-title
      summary: .description
      city: .prop-desc-tipo-ub, .single_property_title p
      rooms: .prop-data2:has(img[src*="/ambientes."]) > div
    detailFields:
      address: p:has(.flaticon-placeholder), h1
      area: .prop_details li, .property-detail li, .property-features li
      price: .price, .price-list-tag, .operation-price
      title: h1, .prop-title
      summary: .description, .property-description
  - name: Suarez Propiedades
    startUrls:
      - https://www.suarezmardelplata.com/Alquiler
      - https://www.suarezmardelplata.com/Venta
    pagination:
      maxPages: 5
      pageParam: p
      firstPage: 2
      params:
        o: 2,2
    listingSelector: a[href^="/p/"]
    publicationUrlRegex: /p/
    fields: {}
    detailFields:
      title: .single_property_title h2, meta[property="og:title"]::attr(content)
      city: .slider-thumb::attr(alt), .single_property_title p, meta[property="og:title"]::attr(content)
      address: .title-address
      area: '.ficha_detalle_item:has(b:contains("Superficie cubierta")), #lista_superficies li:contains("Cubierta:")'
      propertyType: .ficha_detalle_item:has(b:contains("Tipo de Propiedad"))
      rooms: .ficha_detalle_item:has(b:contains("Ambientes"))
    preferConfiguredFields: true
    notes: Selectores Tokko actualizados y fichas de venta/alquiler verificadas en auditoría.
