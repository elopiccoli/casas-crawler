name: Actualizar publicaciones y publicar web

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Filtrar publicaciones por operación"
        required: true
        type: choice
        options:
          - Todos
          - Venta
          - Alquiler
      property_type:
        description: "Filtrar publicaciones por tipo"
        required: true
        type: choice
        options:
          - Todos
          - Casa
          - Departamento
      neighborhoods:
        description: "Barrios separados por coma, o Todos"
        required: true
        type: string
        default: "Todos"
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar publicaciones
        env:
          CRAWLER_OPERATION: ${{ inputs.operation }}
          CRAWLER_PROPERTY_TYPE: ${{ inputs.property_type }}
          CRAWLER_NEIGHBORHOODS: ${{ inputs.neighborhoods }}
        run: npm run crawl:web

      - name: Publicar en Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          credentials_file="${RUNNER_TEMP}/firebase-service-account.json"
          trap 'rm -f "$credentials_file"' EXIT
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]]; then
            echo "Missing GitHub Actions secret: FIREBASE_SERVICE_ACCOUNT" >&2
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials_file"
          chmod 600 "$credentials_file"
          unset FIREBASE_SERVICE_ACCOUNT
          export GOOGLE_APPLICATION_CREDENTIALS="$credentials_file"
          npx firebase-tools deploy --only hosting --project casas-crawler --non-interactive
