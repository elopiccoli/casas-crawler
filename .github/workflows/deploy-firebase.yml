name: Actualizar publicaciones y publicar web

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar publicaciones
        run: npm test && npm run check

      - name: Extraer publicaciones
        if: github.event_name != 'push'
        run: npm run crawl:web

      - name: Publicar en Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project casas-crawler --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
